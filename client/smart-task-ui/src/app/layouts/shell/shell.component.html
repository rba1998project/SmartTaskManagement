<div class="shell-wrapper">
  <mat-toolbar class="shell-toolbar">
    <button
      type="button"
      mat-icon-button
      class="menu-btn"
      (click)="toggleSidenav()"
      aria-label="Toggle navigation"
    >
      <mat-icon>menu</mat-icon>
    </button>
    <a routerLink="/dashboard" class="toolbar-title-link">
      <span class="brand-mark" aria-hidden="true">STM</span>
      <span class="toolbar-title">Smart Task Management</span>
    </a>
    <span class="spacer"></span>
    <button
      mat-icon-button
      class="theme-toggle"
      type="button"
      (click)="themeService.toggle()"
      [matTooltip]="themeToggleLabel()"
      [attr.aria-label]="themeToggleLabel()"
    >
      <mat-icon>{{ themeToggleIcon() }}</mat-icon>
    </button>
    <button
      mat-icon-button
      class="user-avatar"
      type="button"
      [matMenuTriggerFor]="accountMenu"
      aria-label="Open account menu"
    >
      <span class="user-initials">{{ userInitials }}</span>
    </button>
    <mat-menu #accountMenu="matMenu" xPosition="before">
      <a mat-menu-item routerLink="/account">
        <mat-icon>person</mat-icon>
        <span>My Account</span>
      </a>
      <button mat-menu-item type="button" (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  </mat-toolbar>

  <mat-sidenav-container class="shell-body">
    <mat-sidenav
      #sidenav
      [mode]="isMobile() ? 'over' : 'side'"
      [opened]="sidenavOpened()"
      [fixedInViewport]="isMobile()"
      [fixedTopGap]="64"
      (closed)="sidenavOpened.set(false)"
      class="shell-sidenav"
      role="navigation"
      aria-label="Main navigation"
    >
      <nav class="sidenav-nav">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-item" (click)="isMobile() && sidenav.close()">
          <mat-icon class="nav-icon">space_dashboard</mat-icon>
          <span class="nav-text">Dashboard</span>
        </a>
        <a routerLink="/projects" routerLinkActive="active" class="nav-item" (click)="isMobile() && sidenav.close()">
          <mat-icon class="nav-icon">folder_open</mat-icon>
          <span class="nav-text">Projects</span>
        </a>
        <a routerLink="/tasks" routerLinkActive="active" class="nav-item" (click)="isMobile() && sidenav.close()">
          <mat-icon class="nav-icon">task_alt</mat-icon>
          <span class="nav-text">Tasks</span>
        </a>
        @if (isAdmin()) {
          <a routerLink="/users" routerLinkActive="active" class="nav-item" (click)="isMobile() && sidenav.close()">
            <mat-icon class="nav-icon">group</mat-icon>
            <span class="nav-text">User Management</span>
          </a>
        }
        <a routerLink="/account" routerLinkActive="active" class="nav-item" (click)="isMobile() && sidenav.close()">
          <mat-icon class="nav-icon">person</mat-icon>
          <span class="nav-text">My Account</span>
        </a>
      </nav>
    </mat-sidenav>

    <mat-sidenav-content>
      <main class="shell-content">
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
