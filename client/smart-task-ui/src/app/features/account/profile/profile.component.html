<!-- Route: /account -->
<!-- Shows current user info and opens the self-service password change dialog. -->
@if (currentUser(); as user) {
  <div class="profile-page">
    <header class="page-header">
      <div>
        <p class="page-eyebrow">Personal settings</p>
        <h1>My Account</h1>
        <p>Review your identity and manage account security.</p>
      </div>
    </header>
  <mat-card class="profile-card">
    <mat-card-header class="profile-header">
      <mat-card-title>My Account</mat-card-title>
      <span class="spacer"></span>
      <span
        class="change-password-link"
        role="button"
        tabindex="0"
        (click)="openChangePassword()"
        (keydown.enter)="openChangePassword()"
        (keydown.space)="$event.preventDefault(); openChangePassword()"
      >Change Password</span>
    </mat-card-header>

    <mat-card-content>
      <div class="profile-field">
        <span class="label">Email</span>
        <span class="value">{{ user.email }}</span>
      </div>
      <div class="profile-field">
        <span class="label">Full Name</span>
        <span class="value">{{ user.fullName || '-' }}</span>
      </div>
      <div class="profile-field">
        <span class="label">Roles</span>
        <div class="role-chips">
          @for (role of user.roles; track $index) {
            <mat-chip>{{ role }}</mat-chip>
          }
        </div>
      </div>
    </mat-card-content>
  </mat-card>
  </div>
}
